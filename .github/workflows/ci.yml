# The gate TEAM_SPLIT.md → Merge protocol describes: `npm run check` and `npm run contracts:test`
# both have to pass before anything merges. Running them here means that is enforced rather than
# remembered.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck · lint · MiniPay rules · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + lint + MiniPay rule lint + the Node test suite.
      - run: npm run check

      # The bundle budget needs a build first, so it cannot live inside `npm run check`.
      # MiniPay assesses performance, so a regression here is a listing risk.
      - run: npm run build
      - run: npm run check:bundle

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # forge-std and openzeppelin-contracts are submodules pinned to release tags; without
          # them the contracts do not compile.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge fmt --check
        working-directory: contracts

      - run: forge test -vv
        working-directory: contracts
